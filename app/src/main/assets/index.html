<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breathing Box</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap">
<style>
  /* Layout: square stage on the left with a settings card on the right; stacks to one column on phones. */
  :root {
    --bg: #f1ecfa;
    --surface: #faf7ff;
    --fg: #2a1f45;
    --muted: #6e6390;
    --line: #d9cff0;
    --accent: #7c5cc4;
    --accent-fg: #ffffff;
    --track: #ddd3f2;
    --heart: #d9457c;
    --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1426;
      --surface: #231b33;
      --fg: #ece6fa;
      --muted: #a699c7;
      --line: #372c4f;
      --accent: #b79cf0;
      --accent-fg: #1c1230;
      --track: #382d52;
      --heart: #f27aa8;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1a1426;
    --surface: #231b33;
    --fg: #ece6fa;
    --muted: #a699c7;
    --line: #372c4f;
    --accent: #b79cf0;
    --accent-fg: #1c1230;
    --track: #382d52;
    --heart: #f27aa8;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px 40px;
  }
  .app { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
  h1 { font-size: clamp(1.6rem, 4vw, 2.1rem); line-height: 1.15; margin: 0 0 6px; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
  .sub { margin: 0; color: var(--muted); max-width: 52ch; }

  .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; align-items: start; }
  @media (min-width: 780px) { .grid { grid-template-columns: minmax(0, 1fr) minmax(0, 360px); gap: 40px; } }

  .stage { display: flex; flex-direction: column; align-items: center; gap: 20px; min-width: 0; }
  .box { width: 100%; max-width: 440px; aspect-ratio: 1 / 1; max-height: 100%; }
  .box svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .box .tr { fill: none; stroke: var(--track); stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
  .box .prog { stroke: var(--accent); stroke-width: 6; stroke-linecap: round; fill: none; opacity: 0; }
  .box .inner { fill: color-mix(in srgb, var(--accent) 16%, transparent); transform-origin: 50% 50%; transform-box: fill-box; }
  .box .halo { fill: color-mix(in srgb, var(--heart) 40%, transparent); transform-box: fill-box; transform-origin: center; animation: ring 1.2s ease-out infinite; }
  .box .heart { fill: var(--heart); transform-box: fill-box; transform-origin: center; animation: beat 1.2s ease-in-out infinite; }
  @keyframes beat { 0% { transform: scale(1); } 14% { transform: scale(1.28); } 28% { transform: scale(1); } 42% { transform: scale(1.18); } 70%, 100% { transform: scale(1); } }
  @keyframes ring { 0% { transform: scale(0.8); opacity: 0.6; } 45% { transform: scale(1.9); opacity: 0; } 100% { transform: scale(1.9); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .box .heart, .box .halo { animation: none; } }
  .box .lab { font-family: var(--font-body); font-size: 12px; fill: var(--muted); text-anchor: middle; letter-spacing: 0.04em; }
  .box .lab.on { fill: var(--fg); font-weight: 700; }
  .box .word { font-family: var(--font-body); font-size: 15px; fill: var(--muted); text-anchor: middle; text-transform: uppercase; letter-spacing: 0.16em; }
  .box .count { font-family: var(--font-mono); font-size: 64px; font-weight: 500; fill: var(--fg); text-anchor: middle; }

  .controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn { min-width: 112px; padding: 11px 22px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 700; }
  .btn:hover { border-color: var(--accent); }

  .stats { display: flex; gap: 32px; color: var(--muted); font-size: 0.875rem; }
  .stats b { display: block; font-family: var(--font-mono); font-weight: 500; font-size: 1.25rem; color: var(--fg); font-variant-numeric: tabular-nums; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
  .panel h2 { margin: 0; font-size: 0.8125rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-size: 0.875rem; }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 500; }

  .rows { display: flex; flex-direction: column; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; border-top: 1px solid var(--line); }
  .row:first-child { border-top: 0; padding-top: 0; }
  .rl { display: flex; flex-direction: column; min-width: 0; }
  .rl label { font-weight: 700; }
  .rl span { font-size: 0.8125rem; color: var(--muted); }
  .stepper { display: flex; align-items: center; gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg); flex-shrink: 0; }
  .stepper button { width: 40px; height: 40px; border: 0; background: transparent; font-size: 1.25rem; line-height: 1; }
  .stepper button:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .stepper input { width: 3rem; height: 40px; border: 0; border-inline: 1px solid var(--line); background: transparent; color: var(--fg); text-align: center; font-family: var(--font-mono); font-size: 1rem; font-variant-numeric: tabular-nums; -moz-appearance: textfield; appearance: textfield; border-radius: 0; }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .stepper .unit { padding-inline: 8px 10px; font-family: var(--font-mono); font-size: 0.875rem; color: var(--muted); }

  .opts { display: flex; flex-direction: column; gap: 10px; font-size: 0.9375rem; }
  .opts label { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .opts input { accent-color: var(--accent); width: 18px; height: 18px; margin: 0; }
  .cycle { margin: 0; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.9375rem; }
  .cycle b { color: var(--fg); font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

<style>html,body{margin:0}</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Breathing Box</h1>
    <p class="sub">Box breathing, also called square breathing. Follow the heart around the box: inhale up, hold across, exhale down, hold across. Set the seconds for each side.</p>
  </header>

  <div class="grid">
    <section class="stage" aria-label="Breathing box">
      <div class="box">
        <svg viewBox="0 0 320 320" role="img" aria-label="A square that a beating heart travels around, one side per breathing phase">
          <path class="tr" d="M40 280 L40 40 L280 40 L280 280 Z"></path>
          <rect id="inner" class="inner" x="60" y="60" width="200" height="200" rx="10"></rect>
          <line class="prog" id="p0" x1="40" y1="280" x2="40" y2="40" pathLength="1"></line>
          <line class="prog" id="p1" x1="40" y1="40" x2="280" y2="40" pathLength="1"></line>
          <line class="prog" id="p2" x1="280" y1="40" x2="280" y2="280" pathLength="1"></line>
          <line class="prog" id="p3" x1="280" y1="280" x2="40" y2="280" pathLength="1"></line>
          <text class="lab" id="l0" x="22" y="160" transform="rotate(-90 22 160)"></text>
          <text class="lab" id="l1" x="160" y="26"></text>
          <text class="lab" id="l2" x="298" y="160" transform="rotate(90 298 160)"></text>
          <text class="lab" id="l3" x="160" y="308"></text>
          <text class="word" id="word" x="160" y="140">Ready</text>
          <text class="count" id="count" x="160" y="198">4</text>
          <g id="heart" transform="translate(40 280)">
            <circle class="halo" r="14"></circle>
            <path class="heart" d="M0 11 C-17 -1 -15 -15 -7 -15 C-3.5 -15 -1 -12.5 0 -9.5 C1 -12.5 3.5 -15 7 -15 C15 -15 17 -1 0 11 Z"></path>
          </g>
        </svg>
      </div>

      <div class="controls">
        <button type="button" class="btn primary" id="go">Start</button>
        <button type="button" class="btn" id="reset">Reset</button>
      </div>

      <div class="stats" aria-label="Session">
        <div><b id="rounds">0</b>rounds</div>
        <div><b id="time">0:00</b>session time</div>
      </div>
    </section>

    <section class="panel" aria-label="Settings">
      <h2>Seconds per side</h2>
      <div class="chips" id="presets" role="group" aria-label="Presets"></div>
      <div class="rows" id="rows"></div>
      <div class="opts">
        <label for="link"><input type="checkbox" id="link"> Keep all four sides equal</label>
        <label for="sound"><input type="checkbox" id="sound"> Soft tone at each side</label>
      </div>
      <p class="cycle">One round takes <b id="cyc">16 s</b></p>
    </section>
  </div>
  <div class="sr" aria-live="polite" id="live"></div>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var NAMES = ['Inhale', 'Hold', 'Exhale', 'Hold'];
  var SIDES = ['Left side, rising', 'Top side, across', 'Right side, falling', 'Bottom side, across'];
  var C = [[40, 280], [40, 40], [280, 40], [280, 280]];
  var FREQ = [523.25, 440, 392, 440];
  var MIN = 1, MAX = 30, KEY = 'breathing-box-settings';
  var PRESETS = [['Gentle', 3], ['Classic', 4], ['Steady', 5], ['Deep', 6]];
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function clampV(v) {
    v = Math.round(Number(v));
    if (!isFinite(v)) v = 4;
    return Math.min(MAX, Math.max(MIN, v));
  }

  var dur = [4, 4, 4, 4], link = false, sound = false;
  try {
    var s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s && Array.isArray(s.dur) && s.dur.length === 4) dur = s.dur.map(clampV);
    if (s) { link = !!s.link; sound = !!s.sound; }
  } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ dur: dur, link: link, sound: sound })); } catch (e) {} }

  var phase = 0, el = 0, rounds = 0, total = 0, running = false, started = false, last = 0, raf = 0;
  var ac = null, wl = null;

  /* ---- build settings UI ---- */
  var rows = $('rows');
  for (var i = 0; i < 4; i++) {
    var row = document.createElement('div');
    row.className = 'row';
    var who = NAMES[i] + ' (' + SIDES[i].toLowerCase() + ')';
    row.innerHTML =
      '<div class="rl"><label for="d' + i + '">' + NAMES[i] + '</label><span>' + SIDES[i] + '</span></div>' +
      '<div class="stepper">' +
      '<button type="button" data-i="' + i + '" data-d="-1" aria-label="Fewer seconds, ' + who + '">−</button>' +
      '<input id="d' + i + '" data-i="' + i + '" type="number" inputmode="numeric" min="' + MIN + '" max="' + MAX + '" step="1">' +
      '<button type="button" data-i="' + i + '" data-d="1" aria-label="More seconds, ' + who + '">+</button>' +
      '<span class="unit">s</span></div>';
    rows.appendChild(row);
  }
  var presets = $('presets');
  PRESETS.forEach(function (p) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.dataset.v = p[1];
    b.textContent = p[0] + ' ' + p[1] + 's';
    presets.appendChild(b);
  });

  function syncInputs(skip) {
    for (var k = 0; k < 4; k++) if (k !== skip) $('d' + k).value = dur[k];
  }
  function setDur(i, v, fromInput) {
    v = clampV(v);
    if (link) dur = [v, v, v, v]; else dur[i] = v;
    el = Math.min(el, dur[phase] * 1000 - 1);
    if (el < 0) el = 0;
    syncInputs(fromInput ? i : -1);
    save();
    render();
  }

  rows.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-d]');
    if (!b) return;
    var k = +b.dataset.i;
    setDur(k, dur[k] + (+b.dataset.d));
  });
  rows.addEventListener('input', function (e) {
    var t = e.target;
    if (t.tagName !== 'INPUT' || t.value === '') return;
    setDur(+t.dataset.i, t.value, true);
  });
  rows.addEventListener('change', function (e) {
    var t = e.target;
    if (t.tagName !== 'INPUT') return;
    setDur(+t.dataset.i, t.value === '' ? dur[+t.dataset.i] : t.value);
  });
  presets.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-v]');
    if (!b) return;
    var v = +b.dataset.v;
    dur = [v, v, v, v];
    el = Math.min(el, dur[phase] * 1000 - 1);
    syncInputs(-1);
    save();
    render();
  });
  $('link').checked = link;
  $('sound').checked = sound;
  $('link').addEventListener('change', function (e) {
    link = e.target.checked;
    if (link) { var v = dur[0]; dur = [v, v, v, v]; el = Math.min(el, dur[phase] * 1000 - 1); syncInputs(-1); }
    save(); render();
  });
  $('sound').addEventListener('change', function (e) {
    sound = e.target.checked;
    if (sound) ensureAudio();
    save();
  });

  /* ---- audio, wake lock ---- */
  function ensureAudio() {
    try {
      if (!ac) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) ac = new AC(); }
      if (ac && ac.state === 'suspended') ac.resume();
    } catch (e) {}
  }
  function tone(freq) {
    if (!sound || !ac) return;
    try {
      var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.12, t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 0.55);
    } catch (e) {}
  }
  function lock() {
    try {
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').then(function (l) { wl = l; }, function () {});
      }
    } catch (e) {}
  }
  function unlock() { try { if (wl) { wl.release(); wl = null; } } catch (e) {} }

  function cue() {
    $('live').textContent = NAMES[phase] + ', ' + dur[phase] + ' seconds';
    tone(FREQ[phase]);
  }

  /* ---- timing ---- */
  function frame(ts) {
    if (!running) return;
    var dt = Math.min(ts - last, 1000);
    last = ts;
    el += dt;
    total += dt;
    var changed = false;
    while (el >= dur[phase] * 1000) {
      el -= dur[phase] * 1000;
      phase = (phase + 1) % 4;
      if (phase === 0) rounds++;
      changed = true;
    }
    if (changed) cue();
    render();
    raf = requestAnimationFrame(frame);
  }
  function start() {
    ensureAudio();
    var fresh = !started;
    running = true; started = true;
    last = performance.now();
    if (fresh) cue();
    lock();
    render();
    raf = requestAnimationFrame(frame);
  }
  function pause() {
    running = false;
    cancelAnimationFrame(raf);
    unlock();
    render();
  }
  function reset() {
    running = false; started = false;
    cancelAnimationFrame(raf);
    unlock();
    phase = 0; el = 0; rounds = 0; total = 0;
    $('live').textContent = 'Reset';
    render();
  }
  $('go').addEventListener('click', function () { running ? pause() : start(); });
  $('reset').addEventListener('click', reset);
  document.addEventListener('keydown', function (e) {
    if (e.code !== 'Space') return;
    var t = e.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'BUTTON' || t.tagName === 'TEXTAREA')) return;
    e.preventDefault();
    running ? pause() : start();
  });

  /* ---- drawing ---- */
  function ease(p) { return p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; }
  function fmt(ms) {
    var sec = Math.floor(ms / 1000);
    return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
  }

  function render() {
    var d = dur[phase] * 1000;
    var p = started ? Math.min(1, el / d) : 0;
    var a = C[phase], b = C[(phase + 1) % 4];
    var x = a[0] + (b[0] - a[0]) * p, y = a[1] + (b[1] - a[1]) * p;
    $('heart').setAttribute('transform', 'translate(' + x + ' ' + y + ')');

    for (var k = 0; k < 4; k++) {
      var f = !started ? 0 : (k < phase ? 1 : (k === phase ? p : 0));
      var ln = $('p' + k);
      ln.style.strokeDasharray = f + ' 2';
      ln.style.opacity = f > 0.001 ? (k < phase ? 0.4 : 1) : 0;
      var lab = $('l' + k);
      lab.textContent = NAMES[k] + ' · ' + dur[k] + 's';
      lab.setAttribute('class', 'lab' + (started && k === phase ? ' on' : ''));
    }

    var sc = 0.38;
    if (started && !reduce) {
      var e = ease(p);
      if (phase === 0) sc = 0.38 + 0.62 * e;
      else if (phase === 1) sc = 1;
      else if (phase === 2) sc = 1 - 0.62 * e;
    } else if (reduce) sc = 0.7;
    $('inner').style.transform = 'scale(' + sc + ')';

    $('word').textContent = started ? NAMES[phase] : 'Ready';
    $('count').textContent = started ? Math.max(1, Math.ceil((d - el) / 1000)) : dur[0];
    $('go').textContent = running ? 'Pause' : (started ? 'Resume' : 'Start');
    $('rounds').textContent = rounds;
    $('time').textContent = fmt(total);
    $('cyc').textContent = (dur[0] + dur[1] + dur[2] + dur[3]) + ' s';

    var chips = presets.querySelectorAll('.chip');
    for (var c = 0; c < chips.length; c++) {
      var v = +chips[c].dataset.v;
      chips[c].setAttribute('aria-pressed', String(dur.every(function (n) { return n === v; })));
    }
  }

  syncInputs(-1);
  render();
})();
</script>

</body>
</html>
